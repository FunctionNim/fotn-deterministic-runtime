name: MMO KurrentDB HA Diagnostic Witness v0.8d

on:
  workflow_dispatch:
  push:
    branches: [mmo-persistence-production-gates-v0.8]
    paths:
      - 'mmo-production-v0.8/run-kurrent-ha-diagnostic-v0.8d.sh'
      - 'mmo-production-v0.8/run-kurrent-ha-v0.8c.sh'
      - 'mmo-production-v0.8/run-kurrent-ha-v0.8.mjs'
      - 'mmo-production-v0.8/kurrent-secure-cluster-v0.8c.yml'
      - 'mmo-production-v0.8/kurrent-vars-v0.8.env'
      - '.github/workflows/mmo-kurrent-ha-diagnostic-v0.8d.yml'
      - 'mmo-hearing-payload-v2/**'
      - 'mmo-scale-v0.7/**'

permissions:
  contents: read

jobs:
  kurrent_ha_diagnostic_witness:
    name: KurrentDB v0.8c unchanged semantics / diagnostic witness v0.8d
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute unchanged v0.8c gate with redacted diagnostic capture
        run: bash mmo-production-v0.8/run-kurrent-ha-diagnostic-v0.8d.sh
      - name: Upload KurrentDB diagnostic witness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kurrent-secure-ha-diagnostic-v0.8d
          path: /tmp/fotn-lab/reports/*
          if-no-files-found: warn
          retention-days: 14
