name: MMO KurrentDB Secure HA Reference v0.8

on:
  push:
    branches: [mmo-persistence-production-gates-v0.8]
    paths:
      - 'mmo-production-v0.8/run-kurrent-ha-v0.8.mjs'
      - 'mmo-production-v0.8/kurrent-secure-cluster-v0.8.yml'
      - 'mmo-production-v0.8/kurrent-vars-v0.8.env'
      - '.github/workflows/mmo-kurrent-ha-reference-v0.8.yml'
      - 'mmo-hearing-payload-v2/**'

permissions:
  contents: read

jobs:
  kurrent_secure_ha_reference:
    name: KurrentDB secure three-node quorum reference gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: fotnkurrentv08
      KURRENT_CERT_DIR: /tmp/kurrent-certs
      KURRENTDB_CONNECTION_STRING: kurrentdb://admin:fotn-admin-pass@localhost:2111,localhost:2112,localhost:2113?tls=true&tlsVerifyCert=true&tlsCaFile=/tmp/kurrent-certs/ca/ca.crt&nodePreference=leader
      FOTN_PROD_TAIL_COUNT: '1000'
      FOTN_STREAM_ID: prod-blue-kurrent-v0.8-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact Blue/persistence contract
        run: |
          set -euxo pipefail
          mkdir -p /tmp/fotn-lab
          : > /tmp/fotn-lab.zip
          for f in mmo-hearing-payload-v2/part*.b64; do base64 --decode "$f" >> /tmp/fotn-lab.zip; done
          echo 'aa535a41683096d9bf5056b4ab7502da7821a23b811ff6871e3b4531f6710919  /tmp/fotn-lab.zip' | sha256sum -c -
          unzip -q /tmp/fotn-lab.zip -d /tmp/fotn-lab
          mkdir -p /tmp/fotn-lab/reports
          cp mmo-scale-v0.7/scale-blue-fixture.mjs /tmp/fotn-lab/scripts/
          cp mmo-production-v0.8/run-kurrent-ha-v0.8.mjs /tmp/fotn-lab/scripts/
          cd /tmp/fotn-lab
          npm install --no-save @kurrent/kurrentdb-client@1.3.0
          npm run all
      - name: Start documented secure three-node cluster
        working-directory: mmo-production-v0.8
        run: |
          set -euxo pipefail
          sudo mkdir -p /tmp/kurrent-certs
          sudo chown 1000:1000 /tmp/kurrent-certs
          docker compose -f kurrent-secure-cluster-v0.8.yml pull
          docker compose -f kurrent-secure-cluster-v0.8.yml up -d node1.kurrentdb node2.kurrentdb node3.kurrentdb
          for port in 2111 2112 2113; do
            ok=0
            for i in $(seq 1 60); do
              if curl -fsS --cacert /tmp/kurrent-certs/ca/ca.crt -u admin:fotn-admin-pass "https://localhost:${port}/health/live?liveCode=200" >/dev/null; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1
          done
          if curl -fsS http://localhost:2111/health/live >/dev/null 2>&1; then echo 'plaintext endpoint unexpectedly accepted'; exit 1; fi
      - name: Record initial cluster roles and write the exact Blue fixture
        working-directory: /tmp/fotn-lab
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json,ssl,urllib.request,pathlib,base64
          ca='/tmp/kurrent-certs/ca/ca.crt'; ctx=ssl.create_default_context(cafile=ca)
          auth='Basic '+base64.b64encode(b'admin:fotn-admin-pass').decode()
          out=[]
          for p in (2111,2112,2113):
            req=urllib.request.Request(f'https://localhost:{p}/info',headers={'Authorization':auth})
            with urllib.request.urlopen(req,context=ctx,timeout=10) as r: out.append({'port':p,'info':json.load(r)})
          pathlib.Path('reports/kurrent-initial-nodes.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
          FOTN_REPORT_FILE=/tmp/fotn-lab/reports/kurrent-initial-write.json node scripts/run-kurrent-ha-v0.8.mjs write
      - name: Stop the elected leader and require a new leader with continued writes
        working-directory: /tmp/fotn-lab
        run: |
          set -euxo pipefail
          leader=$(python - <<'PY'
          import json
          nodes=json.load(open('reports/kurrent-initial-nodes.json'))
          for n in nodes:
            if str(n['info'].get('state','')).lower()=='leader':
              print({2111:'node1.kurrentdb',2112:'node2.kurrentdb',2113:'node3.kurrentdb'}[n['port']]); break
          PY
          )
          test -n "$leader"
          echo "$leader" > reports/kurrent-original-leader.txt
          docker stop "$leader"
          newleader=''
          for i in $(seq 1 60); do
            newleader=$(python - <<'PY'
          import json,ssl,urllib.request,base64
          ctx=ssl.create_default_context(cafile='/tmp/kurrent-certs/ca/ca.crt'); auth='Basic '+base64.b64encode(b'admin:fotn-admin-pass').decode()
          for p in (2111,2112,2113):
            try:
              req=urllib.request.Request(f'https://localhost:{p}/info',headers={'Authorization':auth})
              with urllib.request.urlopen(req,context=ctx,timeout=2) as r: info=json.load(r)
              if str(info.get('state','')).lower()=='leader': print(p); break
            except Exception: pass
          PY
            )
            [ -n "$newleader" ] && break
            sleep 2
          done
          test -n "$newleader"
          echo "$newleader" > reports/kurrent-new-leader-port.txt
          FOTN_REPORT_FILE=/tmp/fotn-lab/reports/kurrent-after-leader-loss.json node scripts/run-kurrent-ha-v0.8.mjs verify
          FOTN_PROBE_LABEL=leader-loss FOTN_REPORT_FILE=/tmp/fotn-lab/reports/kurrent-leader-loss-probe.json node scripts/run-kurrent-ha-v0.8.mjs probe
      - name: Restart failed node and require healthy three-node membership
        run: |
          set -euxo pipefail
          leader=$(cat /tmp/fotn-lab/reports/kurrent-original-leader.txt)
          docker start "$leader"
          for port in 2111 2112 2113; do
            ok=0
            for i in $(seq 1 60); do curl -fsS --cacert /tmp/kurrent-certs/ca/ca.crt -u admin:fotn-admin-pass "https://localhost:${port}/health/live?liveCode=200" >/dev/null && { ok=1; break; }; sleep 2; done
            test "$ok" = 1
          done
          sleep 5
          for port in 2111 2112 2113; do curl -fsS --cacert /tmp/kurrent-certs/ca/ca.crt -u admin:fotn-admin-pass "https://localhost:${port}/metrics" | head -n 200 > "/tmp/fotn-lab/reports/kurrent-metrics-${port}.txt" || true; done
      - name: Cold-backup all three node volumes, destroy them, and restore the cluster
        working-directory: mmo-production-v0.8
        run: |
          set -euxo pipefail
          docker compose -f kurrent-secure-cluster-v0.8.yml stop node1.kurrentdb node2.kurrentdb node3.kurrentdb
          mkdir -p /tmp/kurrent-backup
          start=$(date +%s%3N)
          for n in 1 2 3; do docker run --rm -v "fotnkurrentv08_kurrent-node${n}-data:/from:ro" -v /tmp/kurrent-backup:/backup alpine sh -lc "cd /from && tar czf /backup/node${n}.tgz ."; done
          end=$(date +%s%3N); echo $((end-start)) > /tmp/fotn-lab/reports/kurrent-backup-duration-ms.txt
          docker compose -f kurrent-secure-cluster-v0.8.yml down -v
          for n in 1 2 3; do docker volume create "fotnkurrentv08_kurrent-node${n}-data"; docker run --rm -v "fotnkurrentv08_kurrent-node${n}-data:/to" -v /tmp/kurrent-backup:/backup alpine sh -lc "cd /to && tar xzf /backup/node${n}.tgz"; done
          start=$(date +%s%3N)
          docker compose -f kurrent-secure-cluster-v0.8.yml up -d node1.kurrentdb node2.kurrentdb node3.kurrentdb
          for port in 2111 2112 2113; do
            ok=0
            for i in $(seq 1 60); do curl -fsS --cacert /tmp/kurrent-certs/ca/ca.crt -u admin:fotn-admin-pass "https://localhost:${port}/health/live?liveCode=200" >/dev/null && { ok=1; break; }; sleep 2; done
            test "$ok" = 1
          done
          end=$(date +%s%3N); echo $((end-start)) > /tmp/fotn-lab/reports/kurrent-restore-duration-ms.txt
      - name: Verify restored canonical history and post-election write
        working-directory: /tmp/fotn-lab
        run: |
          set -euxo pipefail
          FOTN_REPORT_FILE=/tmp/fotn-lab/reports/kurrent-after-restore.json node scripts/run-kurrent-ha-v0.8.mjs verify
          python - <<'PY'
          import json,ssl,urllib.request,pathlib,base64
          ctx=ssl.create_default_context(cafile='/tmp/kurrent-certs/ca/ca.crt'); auth='Basic '+base64.b64encode(b'admin:fotn-admin-pass').decode(); out=[]
          for p in (2111,2112,2113):
            req=urllib.request.Request(f'https://localhost:{p}/info',headers={'Authorization':auth})
            with urllib.request.urlopen(req,context=ctx,timeout=10) as r: out.append({'port':p,'info':json.load(r)})
          pathlib.Path('reports/kurrent-restored-nodes.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Build KurrentDB reference HA evidence
        run: |
          python - <<'PY'
          import json,pathlib
          r=pathlib.Path('/tmp/fotn-lab/reports')
          before=json.loads((r/'kurrent-initial-write.json').read_text()); after=json.loads((r/'kurrent-after-leader-loss.json').read_text()); restored=json.loads((r/'kurrent-after-restore.json').read_text())
          assert before['result']['baseBlueFinalHash']==after['result']['baseBlueFinalHash']==restored['result']['baseBlueFinalHash']=='e3cede0e0bd1a9d84738f06f079a6e7756f785142ee93bcfe0acfca4bf25a4c4'
          assert before['result']['finalDigest']==after['result']['finalDigest']==restored['result']['finalDigest']=='fd941724c74dcdd28319432f479e8be96377fd304ed7cd22d18bd0551ff6a63f'
          nodes=json.loads((r/'kurrent-restored-nodes.json').read_text()); states=[str(n['info'].get('state','')) for n in nodes]
          assert sum(s.lower()=='leader' for s in states)==1
          out={'status':'PASS_KURRENTDB_SECURE_3_NODE_REFERENCE_HA_V0_8','database':'KurrentDB','checks':{'secureTlsCluster':True,'privateCaVerifiedByClient':True,'threeVotingNodes':True,'oneNodeLossContinuedWrites':True,'leaderElection':True,'failedNodeRejoin':True,'coldVolumeBackupDestroyRestore':True,'blueCanonicalHashRecovered':True,'scaleDigestRecovered':True,'metricsCaptured':True},'baseBlueFinalHash':restored['result']['baseBlueFinalHash'],'finalDigest1000Tail':restored['result']['finalDigest'],'backupDurationMs':int((r/'kurrent-backup-duration-ms.txt').read_text()),'restoreDurationMs':int((r/'kurrent-restore-duration-ms.txt').read_text()),'restoredStates':states,'decisionEffect':'REFERENCE_CONFORMANCE_PASS_DOES_NOT_AUTOMATICALLY_REOPEN_POSTGRESQL_PROVISIONAL_SELECTION','boundary':'Secure 3-node Docker quorum reference evidence. Application used authenticated admin credentials for conformance; this is not a least-privilege production application identity gate.'}
          (r/'kurrent-secure-ha-reference-v0.8.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Upload KurrentDB secure HA reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: kurrent-secure-ha-reference-v0.8
          path: /tmp/fotn-lab/reports/*
          if-no-files-found: error
