name: Watcher Sophia Credential Readiness
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Verify protected credentials configured (no secret output)
        env:
          GOOGLE_DOCS_SOURCE_CREDENTIAL: ${{ secrets.GOOGLE_DOCS_SOURCE_CREDENTIAL }}
          COUNCIL_POLICY_CREDENTIAL: ${{ secrets.COUNCIL_POLICY_CREDENTIAL }}
        shell: bash
        run: |
          if [[ -z "$GOOGLE_DOCS_SOURCE_CREDENTIAL" ]]; then
            echo "::error::Protected Google Docs source credential is not configured."
            exit 1
          fi
          if [[ -z "$COUNCIL_POLICY_CREDENTIAL" ]]; then
            echo "::error::Protected Council policy credential is not configured."
            exit 1
          fi
          echo "Credential presence gate passed; live authentication, scopes, custody and source revision remain unverified."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run non-secret adversarial and gateway checks
        run: npx vitest run tests/sway/watcher-sophia-certification.test.ts tests/sway/watcher-sophia-trust-root.audit.test.ts tests/sway/watcher-sophia-trusted-gateway.test.ts tests/sway/watcher-sophia-google-docs.test.ts
