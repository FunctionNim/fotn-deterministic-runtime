name: MMO Persistence Hearing v0.6

on:
  push:
    branches:
      - mmo-persistence-hearing-v0.6
    paths:
      - 'mmo-hearing-v0.6/**'
      - 'mmo-hearing-payload-v2/**'
      - '.github/workflows/mmo-persistence-hearing-v0.6.yml'

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify Blue v0.6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact CI payload
        run: |
          mkdir -p /tmp/fotn-lab
          : > /tmp/fotn-lab.zip
          for f in mmo-hearing-payload-v2/part*.b64; do base64 --decode "$f" >> /tmp/fotn-lab.zip; done
          echo 'aa535a41683096d9bf5056b4ab7502da7821a23b811ff6871e3b4531f6710919  /tmp/fotn-lab.zip' | sha256sum -c -
          unzip -q /tmp/fotn-lab.zip -d /tmp/fotn-lab
          mkdir -p /tmp/fotn-lab/reports
      - name: Run inherited and adversarial qualification
        working-directory: /tmp/fotn-lab
        run: npm run all

  postgres:
    name: PostgreSQL 18.4 live gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact CI payload
        run: |
          mkdir -p /tmp/fotn-lab
          : > /tmp/fotn-lab.zip
          for f in mmo-hearing-payload-v2/part*.b64; do base64 --decode "$f" >> /tmp/fotn-lab.zip; done
          echo 'aa535a41683096d9bf5056b4ab7502da7821a23b811ff6871e3b4531f6710919  /tmp/fotn-lab.zip' | sha256sum -c -
          unzip -q /tmp/fotn-lab.zip -d /tmp/fotn-lab
          mkdir -p /tmp/fotn-lab/reports
      - name: Install PostgreSQL client dependency
        working-directory: /tmp/fotn-lab
        run: npm install --no-save pg@8
      - name: Run PostgreSQL live correctness and latency gate
        working-directory: /tmp/fotn-lab
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: npm run live:postgres
      - name: Restart PostgreSQL service container
        run: |
          CID="$(docker ps --filter ancestor=postgres:18.4 --format '{{.ID}}' | head -1)"
          test -n "$CID"
          docker restart "$CID"
          for i in $(seq 1 30); do
            if docker exec "$CID" pg_isready -U postgres; then exit 0; fi
            sleep 2
          done
          docker logs "$CID"
          exit 1
      - name: Verify PostgreSQL restart durability
        working-directory: /tmp/fotn-lab
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: npm run live:postgres:verify
      - name: Upload PostgreSQL evidence
        uses: actions/upload-artifact@v4
        with:
          name: postgres-live-gate
          path: /tmp/fotn-lab/reports/postgres-live-gate.json
          if-no-files-found: error

  kurrent:
    name: KurrentDB current live gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact CI payload
        run: |
          mkdir -p /tmp/fotn-lab
          : > /tmp/fotn-lab.zip
          for f in mmo-hearing-payload-v2/part*.b64; do base64 --decode "$f" >> /tmp/fotn-lab.zip; done
          echo 'aa535a41683096d9bf5056b4ab7502da7821a23b811ff6871e3b4531f6710919  /tmp/fotn-lab.zip' | sha256sum -c -
          unzip -q /tmp/fotn-lab.zip -d /tmp/fotn-lab
          mkdir -p /tmp/fotn-lab/reports
      - name: Install official KurrentDB Node client
        working-directory: /tmp/fotn-lab
        run: npm install --no-save @kurrent/kurrentdb-client@1.3.0
      - name: Start disposable KurrentDB service
        run: |
          docker pull docker.kurrent.io/kurrent-latest/kurrentdb:latest
          docker run -d --name kurrentdb-node -p 2113:2113 \
            docker.kurrent.io/kurrent-latest/kurrentdb:latest \
            --insecure --run-projections=All --enable-atom-pub-over-http
          for i in $(seq 1 45); do
            if curl -fsS 'http://127.0.0.1:2113/health/live?liveCode=200' >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs kurrentdb-node
          exit 1
      - name: Run KurrentDB live correctness and latency gate
        working-directory: /tmp/fotn-lab
        env:
          KURRENTDB_CONNECTION_STRING: 'kurrentdb://127.0.0.1:2113?tls=false'
        run: npm run live:kurrent
      - name: Restart KurrentDB container
        run: |
          docker restart kurrentdb-node
          for i in $(seq 1 45); do
            if curl -fsS 'http://127.0.0.1:2113/health/live?liveCode=200' >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs kurrentdb-node
          exit 1
      - name: Verify KurrentDB restart durability
        working-directory: /tmp/fotn-lab
        env:
          KURRENTDB_CONNECTION_STRING: 'kurrentdb://127.0.0.1:2113?tls=false'
        run: npm run live:kurrent:verify
      - name: Upload KurrentDB evidence
        uses: actions/upload-artifact@v4
        with:
          name: kurrent-live-gate
          path: /tmp/fotn-lab/reports/kurrent-live-gate.json
          if-no-files-found: error

  hearing:
    name: Persistence Comparison Hearing 001 evidence matrix
    needs:
      - qualify
      - postgres
      - kurrent
    runs-on: ubuntu-latest
    steps:
      - name: Download live evidence
        uses: actions/download-artifact@v4
        with:
          pattern: '*-live-gate'
          merge-multiple: true
          path: /tmp/evidence
      - name: Open hearing only on comparable PASS evidence
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('/tmp/evidence')
          pg = json.loads((root/'postgres-live-gate.json').read_text())
          ku = json.loads((root/'kurrent-live-gate.json').read_text())
          assert pg['status'] == 'PASS_POSTGRESQL_LIVE_V0_6_GATE'
          assert ku['status'] == 'PASS_KURRENTDB_LIVE_V0_6_GATE'
          assert pg['durabilityAfterRestart'] is True
          assert ku['durabilityAfterRestart'] is True
          assert pg['eventCount'] == ku['eventCount'] == 12
          assert pg['finalHash'] == ku['finalHash'] == '53ea6e6396f922f72e01096d8838fbf8f64794cdcbc04ae372de7f9d0b15eb79'
          hearing = {
            'status': 'OPEN_WITH_COMPARABLE_LIVE_EVIDENCE_NO_AUTOMATIC_WINNER',
            'fixture': 'BLUE_MAZE_RIVER_V0_6_ENRICHED_TWO_VISIT_12_EVENT',
            'finalHash': pg['finalHash'],
            'eventCount': 12,
            'postgresql': {'status': pg['status'], 'version': pg.get('version'), 'checks': pg.get('checks'), 'latencyMs': pg.get('latencyMs'), 'durabilityAfterRestart': True},
            'kurrentdb': {'status': ku['status'], 'serverInfo': ku.get('serverInfo'), 'checks': ku.get('checks'), 'latencyMs': ku.get('latencyMs'), 'durabilityAfterRestart': True},
            'decision': 'NO_AUTOMATIC_WINNER',
            'boundary': 'Opening this hearing does not promote either database or the MMO world runtime. Correctness parity is mandatory; latency is evidence, not an automatic selection rule.'
          }
          out = root/'persistence-hearing-001.json'
          out.write_text(json.dumps(hearing, indent=2))
          print(out.read_text())
          PY
      - name: Upload hearing evidence
        uses: actions/upload-artifact@v4
        with:
          name: persistence-hearing-001
          path: /tmp/evidence/persistence-hearing-001.json
          if-no-files-found: error
