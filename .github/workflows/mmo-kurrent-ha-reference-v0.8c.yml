name: MMO KurrentDB Secure HA Reference v0.8c

on:
  push:
    branches: [mmo-persistence-production-gates-v0.8]
    paths:
      - 'mmo-production-v0.8/run-kurrent-ha-v0.8c.sh'
      - 'mmo-production-v0.8/run-kurrent-ha-v0.8.mjs'
      - 'mmo-production-v0.8/kurrent-secure-cluster-v0.8c.yml'
      - 'mmo-production-v0.8/kurrent-vars-v0.8.env'
      - '.github/workflows/mmo-kurrent-ha-reference-v0.8c.yml'
      - 'mmo-hearing-payload-v2/**'
      - 'mmo-scale-v0.7/**'

permissions:
  contents: read

jobs:
  kurrent_secure_ha_reference:
    name: KurrentDB secure three-node quorum reference gate v0.8c
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute KurrentDB 26.1.1 secure quorum gate
        run: bash mmo-production-v0.8/run-kurrent-ha-v0.8c.sh
      - name: Upload KurrentDB secure HA reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kurrent-secure-ha-reference-v0.8c
          path: /tmp/fotn-lab/reports/*
          if-no-files-found: warn
